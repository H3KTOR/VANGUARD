# lab/victim/nginx-vhost-log.conf
#
# Appends the Host header as a trailing quoted field on top of Nginx's
# stock "combined" access-log format -- a realistic, common operator
# customization VANGUARD's WebLogParser already optionally understands
# (see core/internal/detection/parser_web.go's trailing-quoted-field
# support). The stock "combined" format never logs Host at all, so
# without this override the Host Header / Virtual Host Abuse lab
# scenario (Phase 3 feature 10) would have nothing to detect.
log_format vhost '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$host"';

access_log /var/log/nginx/access.log vhost;
