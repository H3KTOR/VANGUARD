# VANGUARD CI -- no secrets, no cloud credentials, no deployment.
# Every job is independent; a job that cannot run is reported by GitHub as
# skipped/failed, never as a pass. This workflow was written on a machine
# without Linux/Docker/CGO and has NOT been executed yet (docs/PHASE8.md).
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: format + vet (linux target)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: core/go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: production build is pure Go (CGO disabled)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/vanguard

  go-test:
    name: go test (linux)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: core/go.mod }
      - name: tests (JSON for the validation report)
        run: go test -json ./... | tee gotest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gotest-linux, path: core/gotest.json }

  race:
    name: go test -race (needs CGO + C compiler for the TEST binary only)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: core/go.mod }
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: CGO_ENABLED=1 go test -race ./...

  frontend:
    name: frontend tests + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: core/frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npx vite build

  lab:
    name: docker lab (all suites, then teardown)
    runs-on: ubuntu-latest
    needs: [static, go-test]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: run every suite (exit 0 pass / 1 fail / 3 blocked)
        run: bash lab/run-all.sh --teardown
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lab-results, path: lab/results }

  report:
    name: validation report
    runs-on: ubuntu-latest
    needs: [go-test, race, lab]
    if: always()
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: core/go.mod }
      - uses: actions/download-artifact@v4
        with: { name: gotest-linux, path: in }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: lab-results, path: in/lab }
        continue-on-error: true
      - name: build report from whatever actually ran
        run: |
          args=""
          [ -f in/gotest.json ] && args="$args -gotest in/gotest.json"
          [ -f in/lab/summary.json ] && args="$args -lab in/lab/summary.json"
          go run ./tools/valreport $args -blocked "race=see the race job result,real ufw verification=not exercised in CI" -out in/validation-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: validation-report, path: core/in }
