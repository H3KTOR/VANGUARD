# VANGUARD CI -- no secrets, no cloud credentials, no deployment, no signing.
#
# STATUS: rewritten in Phase 14, extended in Phase 17, and NEVER EXECUTED. It was written on a Windows
# machine without Docker, a C compiler or a GitHub runner. The first real run is
# its verification, and any job failing on that run is information, not noise.
#
# How results are classified (one row per job; see docs/PHASE14.md):
#   static / unit / frontend / race / windows / vuln / release-check / lab are REQUIRED
#   and are all listed in the final `gate` job. `vuln` needs an external database;
#   findings AND a scan that could not run both FAIL it (a blocked scan is never a pass).
#   A job that did not run (skipped, cancelled, blocked) makes `gate` fail: only
#   `success` counts as a pass. The Docker lab exits 3 when it was blocked, which
#   fails its job; a blocked lab can never look like a successful one.
#   Tests skipped for platform reasons are counted as skipped (never as passed) by
#   tools/valreport in the `report` job.
# Every third-party action is pinned to a full commit SHA (with its version in a
# comment); the update process is in docs/PHASE17.md.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ static
  static:
    name: static checks (format, vet, modules, pure-Go build, deploy scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: core/go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: modules are verified and tidy
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: production build is pure Go (CGO disabled) for every release target
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/vanguard
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/vanguard
      - name: deployment scripts are syntactically valid (this does NOT run them)
        working-directory: .
        run: for f in deploy/*.sh lab/*.sh; do bash -n "$f" || exit 1; done

  # ------------------------------------------------------------------- unit
  go-test:
    name: go test (linux, Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # "mod" = the minimum declared in core/go.mod (untested until this runs);
        # "stable" = the current release.
        go: [mod, stable]
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.go == 'mod' && 'core/go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm, cache-dependency-path: core/frontend/package-lock.json }
      - name: build the dashboard so tests that inspect the embedded production build run instead of skipping
        working-directory: core/frontend
        run: npm ci && npm run build
      - name: tests (JSON for the validation report)
        run: go test -json ./... | tee gotest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.go == 'mod'
        with: { name: gotest-linux, path: core/gotest.json }

  go-test-windows:
    name: go test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: core, shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: core/go.mod }
      - run: go test -json ./... | tee gotest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: gotest-windows, path: core/gotest.json }

  race:
    name: go test -race (needs CGO + a C compiler for the TEST binary only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: core/go.mod }
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: CGO_ENABLED=1 go test -race ./...

  # --------------------------------------------------------------- frontend
  frontend:
    name: frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: core/frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm, cache-dependency-path: core/frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npx vite build
      - name: npm audit (ADVISORY - reported, does not gate)
        continue-on-error: true
        run: npm audit --audit-level=high

  # ----------------------------------------------------- vulnerability scan
  vuln:
    name: govulncheck (findings AND a blocked scan both fail; see deploy/vulncheck.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # A patched toolchain: older Go releases carry reachable standard-library
          # findings (see docs/PHASE17.md). Keep in step with deploy/MIN_GO_TOOLCHAIN.
          go-version: "1.27.2"
      - name: install the pinned scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: scan (exit 0 clean / 1 findings / 3 blocked)
        id: scan
        run: bash deploy/vulncheck.sh linux 2>&1 | tee govulncheck.txt; exit "${PIPESTATUS[0]}"
      - name: say plainly what happened
        if: always()
        run: |
          {
            echo "### govulncheck"
            case "${{ steps.scan.outcome }}" in
              success) echo "No reachable known vulnerability reported. This covers known, reported issues in reachable Go code only; it is not proof of security." ;;
              failure) if grep -q "RESULT: FOUND" govulncheck.txt; then echo "**FINDINGS**: reachable vulnerabilities were reported. See the artifact."; else echo "**BLOCKED**: the scan did not complete (tool, network or build problem). This is NOT a clean result."; fi ;;
              *) echo "The scan did not run (outcome: ${{ steps.scan.outcome }}). This is NOT a clean result." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: govulncheck, path: govulncheck.txt, if-no-files-found: ignore }

  # ------------------------------------------------------------------ lab
  lab:
    name: docker lab (all suites, then teardown)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [static, go-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: run every suite (exit 0 pass / 1 fail / 3 blocked - 1 and 3 both fail this job)
        run: bash lab/run-all.sh --teardown
      - name: lab summary
        if: always()
        run: |
          {
            echo "### Docker lab"
            if [ -f lab/results/summary.json ]; then echo '```json'; cat lab/results/summary.json; echo '```'
            else echo "No summary was produced: the lab did NOT run to completion."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: lab-results, path: lab/results, if-no-files-found: ignore }

  # -------------------------------------------------------------- release
  release-check:
    name: release artifacts, SBOM, manifest, independent rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static, go-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.2" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm, cache-dependency-path: core/frontend/package-lock.json }
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - run: cd core/frontend && npm ci && npm run build
      - name: "build (with SBOMs), rebuild on this runner, check the manifest"
        run: bash deploy/release.sh --version "ci-${GITHUB_SHA::12}" --out dist --check-repro
      - name: checksums verify
        run: cd dist && sha256sum -c SHA256SUMS
      - name: "rebuild from a fresh clone in a DIFFERENT directory and compare the binaries"
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          git clone --quiet . "$RUNNER_TEMP/clone"
          (cd "$RUNNER_TEMP/clone/core/frontend" && npm ci && npm run build)
          (cd "$RUNNER_TEMP/clone" && SOURCE_DATE_EPOCH="$epoch" bash deploy/release.sh --version "ci-${GITHUB_SHA::12}" --out "$RUNNER_TEMP/clone-dist")
          status=0
          for f in dist/vanguard-ci-*-linux-*; do
            case "$f" in *.cdx.json) continue ;; esac
            if cmp -s "$f" "$RUNNER_TEMP/clone-dist/$(basename "$f")"; then echo "IDENTICAL  $(basename "$f")"; else echo "DIFFERENT  $(basename "$f")"; status=1; fi
          done
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release-unsigned, path: dist }

  # Signing happens ONLY on a version tag and ONLY if the repository owner has
  # stored a private key as the secret RELEASE_SIGNING_KEY (an ed25519 key from
  # `go run ./core/tools/relsign keygen`). Without it nothing is signed and the
  # job says so; it never generates a key of its own.
  release-sign:
    name: sign release (tags only; needs the RELEASE_SIGNING_KEY secret)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-check, gate]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
    steps:
      - name: stop if there is no key
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "### release-sign" >> "$GITHUB_STEP_SUMMARY"
            echo "**NOT SIGNED**: the RELEASE_SIGNING_KEY secret is not configured. The artifacts from release-check are UNSIGNED." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.2" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm, cache-dependency-path: core/frontend/package-lock.json }
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - run: cd core/frontend && npm ci && npm run build
      - name: build and sign (the key lives only in a 0600 file outside the workspace, removed afterwards)
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/signing.key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          bash deploy/release.sh --version "${GITHUB_REF_NAME}" --out dist --sign-key "$key"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release-signed, path: dist }

  # --------------------------------------------------------------- report
  report:
    name: validation report
    runs-on: ubuntu-latest
    needs: [go-test, go-test-windows, race, lab]
    if: always()
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: core/go.mod }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: gotest-linux, path: in/linux }
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: gotest-windows, path: in/windows }
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: lab-results, path: in/lab }
        continue-on-error: true
      - name: build one report per platform from whatever actually ran
        run: |
          race="${{ needs.race.result }}"; lab="${{ needs.lab.result }}"
          blocked="race=job result was ${race},docker lab=job result was ${lab},real ufw verification=not exercised in CI"
          if [ -f in/linux/gotest.json ]; then
            args="-gotest in/linux/gotest.json"; [ -f in/lab/summary.json ] && args="$args -lab in/lab/summary.json"
            go run ./tools/valreport $args -blocked "$blocked" -out in/validation-linux
          fi
          if [ -f in/windows/gotest.json ]; then
            go run ./tools/valreport -gotest in/windows/gotest.json -blocked "linux-only behaviour=not covered by a windows run" -out in/validation-windows
          fi
          for f in in/validation-*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: validation-report, path: core/in, if-no-files-found: ignore }

  # ----------------------------------------------------------------- gate
  gate:
    name: required checks (only 'success' counts as a pass)
    runs-on: ubuntu-latest
    needs: [static, go-test, go-test-windows, race, frontend, vuln, lab, release-check]
    if: always()
    steps:
      - name: fail unless every required job succeeded
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          bad=$(grep -o '"result": *"[a-z_]*"' needs.json | grep -v '"success"' || true)
          if [ -n "$bad" ]; then
            echo "Not every required job succeeded (skipped, cancelled, failed and blocked all count as NOT passed):"
            cat needs.json
            exit 1
          fi
          echo "All required jobs succeeded. (The advisory vulnerability scan is reported separately.)"
