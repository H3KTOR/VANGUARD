# /etc/systemd/system/vanguard.service.d/monitor-only.conf
#
# Least-privilege variant: detection, incidents, dashboard and honeypot WITHOUT
# any firewall enforcement. Bans are still decided and recorded, but nothing is
# blocked at the OS level; no sudo, no sudoers rule, no setuid binary involved,
# so NoNewPrivileges can be on and the ufw paths need not be writable.
#
# Install:  sudo install -D -m 0644 deploy/vanguard-monitor-only.conf \
#               /etc/systemd/system/vanguard.service.d/monitor-only.conf
#           sudo systemctl daemon-reload && sudo systemctl restart vanguard
#
# STATUS: not loaded by a real systemd (see deploy/vanguard.service).

[Service]
NoNewPrivileges=true
# An empty assignment clears the base unit's list before setting the new one.
ReadWritePaths=
ReadWritePaths=/opt/vanguard/data
ExecStart=
ExecStart=/usr/local/bin/vanguard serve \
    -db /opt/vanguard/data/vanguard.db \
    -http-addr 127.0.0.1:8080 \
    -auth-log /var/log/auth.log \
    -honeypot=true \
    -metrics-interval 30s \
    -metrics-retention 168h \
    -disk-path / \
    -shutdown-timeout 15s
